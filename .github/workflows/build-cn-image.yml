name: Build CN image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 4.7.5), defaults to latest tag'
        required: false
  workflow_run:
    workflows: ['Sync upstream']
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - id: ver
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -n "${VERSION_INPUT}" ]; then TAG="${VERSION_INPUT}"; fi
          if [ -z "${TAG}" ] || [ "${TAG}" = "main" ]; then TAG=$(jq -r '.stable.coolify // empty' release.json); fi
          if [ -z "${TAG}" ]; then echo "::error::Unable to determine the version to build, release.json sets no stable.coolify version" >&2; exit 1; fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COOLIFY_VERSION=${{ steps.ver.outputs.image_tag }}
          tags: |
            ghcr.io/tktogether/coollabsio/coolify:${{ steps.ver.outputs.image_tag }}
            ghcr.io/tktogether/coollabsio/coolify:latest
  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          VERSION=$(jq -r '.helper.version' upstream.json)
          docker pull "docker.io/coollabsio/coolify-helper:${VERSION}"
          docker tag "docker.io/coollabsio/coolify-helper:${VERSION}" "ghcr.io/tktogether/coollabsio/coolify-helper:${VERSION}"
          docker push "ghcr.io/tktogether/coollabsio/coolify-helper:${VERSION}"
