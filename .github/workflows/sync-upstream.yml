name: Sync upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git remote add upstream https://github.com/coollabsio/coolify.git
          git fetch upstream main
          BEHIND=$(git rev-list --count main..upstream/main)
          echo "upstream ahead by ${BEHIND} commits"
          if [ "${BEHIND}" -eq 0 ]; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "cn-sync-bot"
          git config user.email "noreply@users.noreply.github.com"
          # The files the fork touches conflict mechanically. The reconciler
          # resolves those, re-applies the fork's lines, and aborts on any other
          # conflict so a real upstream change still fails the run.
          git merge --no-edit --no-commit upstream/main || true
          bash .github/scripts/reconcile-upstream-merge.sh upstream/main
          git commit --no-edit
          git push origin main
